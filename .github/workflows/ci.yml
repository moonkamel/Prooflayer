# CI de ProofLayer (PL-101) : typecheck, lint, tests et validation du schéma Prisma sur chaque PR.
# Les noms des jobs (`checks`, `e2e`, `db`) sont ceux à déclarer comme checks obligatoires dans la protection de `main`.
# Actions épinglées par SHA de commit (§4.7 : compromission d'une dépendance) ; le tag figure en commentaire.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # §4.7 : aucun script d'installation exécuté en CI.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Client Prisma généré (non versionné) : requis par le typecheck et le build.
      - run: pnpm db:generate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm test:classify
      - run: pnpm db:validate

  # Parcours Playwright sur le vrai serveur et une vraie base (PL-103 : authentification de bout en bout).
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: prooflayer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Migrations et préparation des tests : rôle de migration.
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/prooflayer
      # Serveur testé : rôle applicatif, comme en production. Mot de passe propre à cette base jetable.
      DATABASE_URL: postgresql://prooflayer_app:ci-only@localhost:5432/prooflayer
      # Secret propre à ce job, sans valeur hors de lui ; requis aussi au build par Better Auth.
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm db:generate
      - run: pnpm db:migrate
      - name: Mot de passe du rôle applicatif (base jetable)
        run: psql "$DIRECT_DATABASE_URL" -v ON_ERROR_STOP=1 -c "ALTER ROLE prooflayer_app PASSWORD 'ci-only'"
      # Navigateur sans dépendre des dépôts apt d'Ubuntu (résolution DNS défaillante sur les runners, nov. 2026) :
      # Google Chrome préinstallé sur l'image GitHub, sinon Chromium de Playwright, sans paquets système.
      - name: Navigateur pour Playwright
        timeout-minutes: 5
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
            google-chrome --version
          else
            pnpm exec playwright install chromium
          fi
      - run: pnpm build
      - run: pnpm test:e2e

  # PL-102 : migrations appliquées, rôle applicatif vérifié, retour arrière et rejeu, sur une base jetable.
  # PL-104 : tests d'intégration sur la même base.
  db:
    name: db
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # Même version majeure que le projet Supabase (Postgres 17).
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: prooflayer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/prooflayer
      DB_CHECK_CONFIRM: jetable
      # Tests d'intégration : rôle applicatif, comme en production. Mot de passe propre à cette base jetable.
      DATABASE_URL: postgresql://prooflayer_app:ci-only@localhost:5432/prooflayer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm db:generate
      - run: pnpm db:check
      # PL-104 : refus de chaque procédure tRPC pour chaque rôle insuffisant, sur la base migrée par db:check.
      - name: Mot de passe du rôle applicatif (base jetable)
        run: psql "$DIRECT_DATABASE_URL" -v ON_ERROR_STOP=1 -c "ALTER ROLE prooflayer_app PASSWORD 'ci-only'"
      - run: pnpm test:integration
